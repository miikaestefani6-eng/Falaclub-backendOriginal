name: E2E Unification Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to test
        required: true
        default: feat/unify-pixel-frontend
        type: string
      render_api_url:
        description: Render staging API URL
        required: true
        default: https://falaclub-backend-staging.onrender.com
        type: string

jobs:
  e2e-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout unification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Render E2E
        env:
          RENDER_API_URL: ${{ inputs.render_api_url }}
          SUPABASE_URL: https://elvmyktosxhldduhkxge.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npm run test:e2e:render
